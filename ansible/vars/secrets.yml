# Ansible Secrets (Encrypt with ansible-vault)
# Usage: ansible-vault encrypt ansible/vars/secrets.yml

# HuggingFace
huggingface_token: "{{ lookup('env', 'HUGGINGFACE_TOKEN') }}"

# Slack
slack_webhook_url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') }}"

# AWS (if using cloud training)
aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
