# ═══════════════════════════════════════════════════════════════════════════════
# SISI LOLA - NIGHTLY DATA INGESTION WORKFLOW v3.0
# ═══════════════════════════════════════════════════════════════════════════════
# Comprehensive data ingestion from 50+ Nigerian sources
# Sources: YouTube channels, Voice datasets, RSS feeds, HuggingFace datasets
# Features: Quality scoring, DVC versioning, HuggingFace sync
# Triggers: schedule (2 AM UTC), manual dispatch, config changes
# ═══════════════════════════════════════════════════════════════════════════════

name: Nightly Data Ingestion

on:
  schedule:
    - cron: '0 2 * * *'  # Every night at 2 AM UTC
  
  workflow_dispatch:
    inputs:
      sources:
        description: 'Data sources to ingest'
        required: false
        type: choice
        options:
          - all
          - youtube
          - rss
          - huggingface
          - voice
          - video
        default: all
      max_items:
        description: 'Max items per source (0 = unlimited)'
        required: false
        default: '100'
      min_quality:
        description: 'Minimum quality score (0-100)'
        required: false
        default: '60'
      enable_dvc:
        description: 'Enable DVC versioning'
        required: false
        type: boolean
        default: true

  push:
    paths:
      - 'training_videos/**'
      - 'ml_training/configs/nigerian_data_sources.yaml'

env:
  PYTHON_VERSION: '3.11'
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Multi-Source Data Ingestion
  # ═══════════════════════════════════════════════════════════════════════════
  ingest-data:
    name: 📹 Ingest Training Data
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour timeout for comprehensive ingestion
    
    outputs:
      total_ingested: ${{ steps.ingest.outputs.total }}
      youtube_count: ${{ steps.ingest.outputs.youtube }}
      voice_count: ${{ steps.ingest.outputs.voice }}
      average_quality: ${{ steps.ingest.outputs.quality }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0  # Full history for DVC
          submodules: false
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 🧹 Free Disk Space
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          docker system prune -af --volumes || true
          df -h
      
      - name: 📦 Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr git-lfs
      
      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml yt-dlp feedparser requests aiohttp aiofiles
          pip install datasets huggingface_hub transformers
          pip install dvc dvc-s3 python-dotenv
      
      - name: 🔐 Configure DVC
        if: ${{ github.event.inputs.enable_dvc != 'false' }}
        run: |
          if [ ! -d ".dvc" ]; then
            dvc init
          fi
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            dvc remote add -d s3_remote s3://sisi-lola-datasets/ingestion || true
          fi
      
      - name: 🎙️ Run Comprehensive Ingestion
        id: ingest
        run: |
          cd ml_training/scripts
          
          SOURCES="${{ github.event.inputs.sources || 'all' }}"
          MAX_ITEMS="${{ github.event.inputs.max_items || '100' }}"
          MIN_QUALITY="${{ github.event.inputs.min_quality || '60' }}"
          
          echo "🚀 Starting ingestion from 50+ Nigerian sources..."
          echo "   Sources: $SOURCES | Max items: $MAX_ITEMS | Min quality: $MIN_QUALITY"
          
          # Run comprehensive ingestion script
          python nightly_ingestion.py \
            --sources "$SOURCES" \
            --max-items "$MAX_ITEMS" \
            --min-quality "$MIN_QUALITY" \
            --stats 2>&1 | tee ingestion_output.log
          
          # Parse results
          TOTAL=$(grep -oP 'Total items ingested: \K\d+' ingestion_output.log || echo "0")
          YOUTUBE=$(grep -oP 'YouTube: \K\d+' ingestion_output.log || echo "0")
          VOICE=$(grep -oP 'Voice datasets: \K\d+' ingestion_output.log || echo "0")
          QUALITY=$(grep -oP 'Average quality: \K[\d.]+' ingestion_output.log || echo "0")
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "youtube=$YOUTUBE" >> $GITHUB_OUTPUT
          echo "voice=$VOICE" >> $GITHUB_OUTPUT
          echo "quality=$QUALITY" >> $GITHUB_OUTPUT
          
          echo "### 📊 Ingestion Results" >> $GITHUB_STEP_SUMMARY
          echo "| Source | Items |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| YouTube | $YOUTUBE |" >> $GITHUB_STEP_SUMMARY
          echo "| Voice Datasets | $VOICE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "| **Avg Quality** | **$QUALITY/100** |" >> $GITHUB_STEP_SUMMARY
      
      - name: 📦 Version with DVC
        if: ${{ github.event.inputs.enable_dvc != 'false' && steps.ingest.outputs.total > 0 }}
        run: |
          if [ -d "ml_training/datasets/ingested" ]; then
            dvc add ml_training/datasets/ingested
            git add ml_training/datasets/ingested.dvc .gitignore || true
          fi
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            dvc push || echo "DVC push skipped"
          fi
      
      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-data-${{ github.run_number }}
          path: |
            ml_training/datasets/ingested/**/*.json
            ml_training/datasets/ingested/**/*.jsonl
            ml_training/scripts/ingestion.db
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Quality Analysis & HuggingFace Sync
  # ═══════════════════════════════════════════════════════════════════════════
  analyze-and-sync:
    name: 📊 Quality Analysis & Sync
    runs-on: ubuntu-latest
    needs: ingest-data
    if: needs.ingest-data.outputs.total_ingested > 0
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: pip install pandas huggingface_hub
      
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ingestion-data-${{ github.run_number }}
          path: ml_training/datasets/ingested
      
      - name: 📊 Generate Quality Report
        run: |
          python -c "
          import json
          from pathlib import Path
          
          ingested = Path('ml_training/datasets/ingested')
          tiers = {'gold': 0, 'silver': 0, 'bronze': 0}
          
          for f in ingested.rglob('*.json'):
              try:
                  data = json.load(open(f))
                  tier = data.get('quality_tier', 'bronze')
                  tiers[tier] = tiers.get(tier, 0) + 1
              except: pass
          
          print(f'Quality Distribution: {tiers}')
          
          with open('quality_report.md', 'w') as f:
              f.write('# Quality Report\n\n')
              for tier, count in tiers.items():
                  f.write(f'- **{tier.capitalize()}**: {count}\n')
          "
      
      - name: 🚀 Push to HuggingFace
        if: ${{ env.HF_TOKEN != '' }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          from pathlib import Path
          from datetime import datetime
          
          api = HfApi(token=os.environ.get('HF_TOKEN'))
          ingested = Path('ml_training/datasets/ingested')
          
          if ingested.exists():
              for f in list(ingested.rglob('*.jsonl'))[:10]:
                  try:
                      api.upload_file(
                          path_or_fileobj=str(f),
                          path_in_repo=f'ingested/{datetime.now().strftime(\"%Y%m%d\")}/{f.name}',
                          repo_id='SisiLolaAI/training-data',
                          repo_type='dataset'
                      )
                      print(f'✓ Uploaded {f.name}')
                  except Exception as e:
                      print(f'Skip {f.name}: {e}')
          "

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Notifications
  # ═══════════════════════════════════════════════════════════════════════════
  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    needs: [ingest-data, analyze-and-sync]
    if: always()
    
    steps:
      - name: 📧 Summary
        run: |
          echo "### ✅ Nightly Data Ingestion Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Total Ingested: ${{ needs.ingest-data.outputs.total_ingested }}" >> $GITHUB_STEP_SUMMARY
          echo "- YouTube: ${{ needs.ingest-data.outputs.youtube_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Voice Datasets: ${{ needs.ingest-data.outputs.voice_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Avg Quality: ${{ needs.ingest-data.outputs.average_quality }}/100" >> $GITHUB_STEP_SUMMARY
