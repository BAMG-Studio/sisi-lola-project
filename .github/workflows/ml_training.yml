name: ML Training Orchestration

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      training_mode:
        description: 'Training mode'
        required: true
        type: choice
        options:
          - full
          - partial
          - phasic
        default: 'partial'
      
      target_model:
        description: 'Target model (or "all")'
        required: true
        type: choice
        options:
          - all
          - natlas_audio
          - avatar_vision
          - content_classifier
        default: 'all'
      
      target_phase:
        description: 'Target phase (for phasic mode)'
        required: false
        type: choice
        options:
          - foundation
          - refinement
          - production
        default: 'foundation'
  
  # Scheduled retraining
  schedule:
    # Weekly Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  
  # NOTE: Push trigger disabled to prevent failures on every commit
  # Use workflow_dispatch for manual training or wait for scheduled run
  # push:
  #   paths:
  #     - '04_AUDIO_CORE/**'
  #     - '01_AVATAR_DNA/**'
  #     - '03_MEDIA_ASSETS/**'
  #   branches:
  #     - main

env:
  PYTHON_VERSION: '3.12'
  ANSIBLE_VERSION: '2.15'

jobs:
  detect-training-need:
    name: Detect Training Requirements
    runs-on: ubuntu-latest
    outputs:
      should_train: ${{ steps.check.outputs.should_train }}
      models_to_train: ${{ steps.check.outputs.models }}
      training_mode: ${{ steps.check.outputs.mode }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install pyyaml python-dotenv
      
      - name: Detect training requirements
        id: check
        run: |
          python ml_training/scripts/detect_training_need.py \
            --config ml_training/configs/training_config.yaml \
            --event-type ${{ github.event_name }} \
            --changed-files "${{ github.event.head_commit.modified }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  train-models:
    name: Train ML Models
    needs: detect-training-need
    if: needs.detect-training-need.outputs.should_train == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Free disk space
        run: |
          # Remove unnecessary pre-installed software to free ~10GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install -r ml_training/requirements.txt
      
      - name: Setup Ansible
        run: |
          pip install ansible==${{ env.ANSIBLE_VERSION }}
          ansible-galaxy collection install community.general
      
      - name: Configure environment
        run: |
          echo "${{ secrets.ENV_FILE }}" > sisi_lola_api/.env
      
      - name: Run Ansible playbook
        run: |
          ansible-playbook ansible/playbooks/ml_training.yml \
            -e "mode=${{ github.event.inputs.training_mode || needs.detect-training-need.outputs.training_mode || 'partial' }}" \
            -e "model=${{ github.event.inputs.target_model || needs.detect-training-need.outputs.models_to_train || 'all' }}" \
            -e "phase=${{ github.event.inputs.target_phase || 'foundation' }}" \
            -v
        env:
          ANSIBLE_STDOUT_CALLBACK: yaml
          ANSIBLE_FORCE_COLOR: true
      
      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-logs-${{ github.run_number }}
          path: |
            ml_training/logs/
            ml_training/checkpoints/*/metadata.json
          retention-days: 30
      
      - name: Upload model checkpoints
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: model-checkpoints-${{ github.run_number }}
          path: ml_training/checkpoints/
          retention-days: 90
      
      - name: Notify on completion
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ML Training ${{ job.status }}
            Mode: ${{ github.event.inputs.training_mode || 'auto' }}
            Model: ${{ github.event.inputs.target_model || 'auto-detected' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  validate-models:
    name: Validate Trained Models
    needs: train-models
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download model checkpoints
        uses: actions/download-artifact@v4
        with:
          name: model-checkpoints-${{ github.run_number }}
          path: ml_training/checkpoints/
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run validation suite
        run: |
          python ml_training/scripts/validate_all_models.py \
            --checkpoints ml_training/checkpoints/ \
            --report ml_training/logs/validation_report.json
      
      - name: Generate validation report
        run: |
          python ml_training/scripts/generate_report.py \
            --input ml_training/logs/validation_report.json \
            --output ml_training/logs/validation_report.md
      
      - name: Comment validation results
        uses: actions/github-script@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ml_training/logs/validation_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  deploy-models:
    name: Deploy Models to Production
    needs: validate-models
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Download model checkpoints
        uses: actions/download-artifact@v4
        with:
          name: model-checkpoints-${{ github.run_number }}
          path: ml_training/checkpoints/
      
      - name: Deploy to HuggingFace Hub
        run: |
          python ml_training/scripts/deploy_models.py \
            --checkpoints ml_training/checkpoints/ \
            --hub-token ${{ secrets.HUGGINGFACE_TOKEN }}
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      
      - name: Update production config
        run: |
          python ml_training/scripts/update_production_config.py \
            --models ml_training/checkpoints/ \
            --config sisi_lola_api/.env
      
      - name: Commit updated config
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update production model versions [skip ci]"
          file_pattern: "sisi_lola_api/.env"
