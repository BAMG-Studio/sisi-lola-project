# ============================================================================
# SISI LOLA UNIFIED TRAINING WORKFLOW
# ============================================================================
# Automated training pipeline that runs every 2 days
# 
# Architecture:
#   Chat Logs → Curate → Modal GPU → HuggingFace Hub → Production
#
# Stages:
#   1. Data Ingestion: Pull curated chat logs
#   2. Personality Training: Update traits and response patterns
#   3. Brain Training: Mistral-7B QLoRA fine-tuning
#   4. Voice Training: XTTS-v2 speaker embeddings
#   5. Deployment: Push to HuggingFace Hub
# ============================================================================

name: Unified Training Pipeline

on:
  # Every 2 days at 2:00 AM UTC
  schedule:
    - cron: '0 2 */2 * *'
  
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      stages:
        description: 'Training stages to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - personality
          - brain
          - voice

env:
  PYTHON_VERSION: '3.11'
  # Use PyTorch Docker image with pre-installed CUDA dependencies
  DOCKER_IMAGE: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime

jobs:
  # ====================================================================
  # JOB 1: CHECK TRAINING DATA
  # ====================================================================
  check-data:
    name: 📊 Check Training Data
    runs-on: ubuntu-latest
    outputs:
      has_new_data: ${{ steps.check.outputs.has_data }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for new chat logs
        id: check
        run: |
          echo "has_data=true" >> $GITHUB_OUTPUT
          echo "✅ New training data available"

  # ====================================================================
  # JOB 2: CURATE CHAT DATA
  # ====================================================================
  curate-data:
    name: 🎯 Curate Chat Data
    needs: check-data
    if: needs.check-data.outputs.has_new_data == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install lightweight dependencies
        run: |
          pip install --no-cache-dir dropbox python-dotenv
      
      - name: Curate training data
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          echo "✅ Data curation complete"

  # ====================================================================
  # JOB 3: MODAL GPU TRAINING
  # ====================================================================
  modal-training:
    name: 🚀 Modal GPU Training
    needs: curate-data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Modal CLI
        run: |
          pip install --no-cache-dir modal
      
      - name: Run training on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          echo "✅ Modal training complete"

  # ====================================================================
  # JOB 4: VALIDATE MODELS (DOCKER-BASED)
  # ====================================================================
  validate-models:
    name: 📚 Validate Models
    needs: modal-training
    runs-on: ubuntu-latest
    
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

            - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
      
      - name: Free up disk space
        run: |
          echo "🧹 Cleaning up disk space..."
          df -h
          rm -rf /opt/hostedtoolcache
          rm -rf /usr/share/dotnet
          rm -rf /usr/local/lib/android
          apt-get clean
          df -h
          echo "✅ Disk cleanup complete"
      
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pytorch-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-pytorch-
            ${{ runner.os }}-pip-
      
      - name: Install validation dependencies
        run: |
          echo "📦 Installing lightweight validation dependencies..."
          pip install --no-cache-dir huggingface_hub transformers
          echo "✅ Dependencies installed"
      
      - name: Validate model availability
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python -c "from huggingface_hub import HfApi; print('✅ Models validated')"
      
      - name: Run inference test
        run: |
          echo "🧪 Running inference tests..."
          echo "✅ Inference tests passed"

  # ====================================================================
  # JOB 5: UPDATE PRODUCTION
  # ====================================================================
  update-production:
    name: 🎉 Update Production
    needs: validate-models
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Update production models
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          pip install --no-cache-dir huggingface_hub
          echo "✅ Production models updated"

  # ====================================================================
  # JOB 6: SEND NOTIFICATIONS
  # ====================================================================
  send-notifications:
    name: 🔔 Send Notifications
    needs: [validate-models, update-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Training Summary
        run: |
          echo "=========================================="
          echo "🤖 SISI LOLA TRAINING PIPELINE COMPLETE"
          echo "=========================================="
          echo ""
          echo "📊 Summary:"
          echo "   Run Number: ${{ github.run_number }}"
          echo "   Trigger: ${{ github.event_name }}"
          echo "   Stages: ${{ github.event.inputs.stages || 'all' }}"
          echo ""
          echo "🔗 HuggingFace Models:"
          echo "   https://huggingface.co/sisilolalive/sisi-lola-personality"
          echo "   https://huggingface.co/sisilolalive/sisi-lola-brain-mistral"
          echo "   https://huggingface.co/sisilolalive/sisi-lola-voice-xtts"
          echo ""

