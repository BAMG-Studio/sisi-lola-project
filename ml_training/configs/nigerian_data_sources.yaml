  youtube_channels:
    - id: tunde-ednut
      name: "Tunde Ednut"
      url: https://youtube.com/@TundeEdnut
      content_type: entertainment
      language: pidgin-english
      use_for: [entertainment_style, reactions, trending]
      
    - id: mark-angel
      name: "Mark Angel Comedy"
      url: https://youtube.com/@MarkAngelComedy
      content_type: comedy
      language: pidgin-english
      use_for: [comedy_timing, expressions, dialogue]
      
    - id: broda-shaggi
      name: "Broda Shaggi"
      url: https://youtube.com/@BrodaShaggi
      content_type: comedy
      language: pidgin
      use_for: [pidgin_fluency, expressions, comedy]
      
