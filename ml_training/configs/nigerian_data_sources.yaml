# ═══════════════════════════════════════════════════════════════════════════════
# SISI LOLA - NIGERIAN DATA SOURCES REGISTRY
# ═══════════════════════════════════════════════════════════════════════════════
# 50+ curated sources for voice, cultural context, and video training
# Last Updated: 2025-01-03
# ═══════════════════════════════════════════════════════════════════════════════

version: "2.0"
last_updated: "2025-01-03"

# ═══════════════════════════════════════════════════════════════════════════════
# VOICE & SPEECH DATASETS (TTS/STT Training)
# ═══════════════════════════════════════════════════════════════════════════════
voice_datasets:
  # ─────────────────────────────────────────────────────────────────────────────
  # TIER 1: PRIMARY - High Quality, Ready to Use
  # ─────────────────────────────────────────────────────────────────────────────
  primary:
    - id: mms-tts-yor
      name: "MMS TTS Yoruba"
      source: facebook/mms-tts-yor
      platform: huggingface
      language: yoruba
      type: tts
      quality: high
      samples: 10000+
      use_for: [voice_synthesis, pronunciation]
      
    - id: mms-tts-hau
      name: "MMS TTS Hausa"
      source: facebook/mms-tts-hau
      platform: huggingface
      language: hausa
      type: tts
      quality: high
      samples: 10000+
      use_for: [voice_synthesis, pronunciation]
      
    - id: mms-tts-ibo
      name: "MMS TTS Igbo"
      source: facebook/mms-tts-ibo
      platform: huggingface
      language: igbo
      type: tts
      quality: high
      samples: 10000+
      use_for: [voice_synthesis, pronunciation]
      
    - id: mms-tts-pcm
      name: "MMS TTS Nigerian Pidgin"
      source: facebook/mms-tts-pcm
      platform: huggingface
      language: pidgin
      type: tts
      quality: high
      samples: 5000+
      use_for: [voice_synthesis, pidgin_pronunciation]
      
    - id: fleurs-yo
      name: "Google FLEURS Yoruba"
      source: google/fleurs
      platform: huggingface
      language: yoruba
      type: asr
      quality: high
      samples: 2000+
      use_for: [speech_recognition, transcription]
      
    - id: fleurs-ha
      name: "Google FLEURS Hausa"
      source: google/fleurs
      platform: huggingface
      language: hausa
      type: asr
      quality: high
      samples: 2000+
      use_for: [speech_recognition, transcription]
      
    - id: fleurs-ig
      name: "Google FLEURS Igbo"
      source: google/fleurs
      platform: huggingface
      language: igbo
      type: asr
      quality: high
      samples: 2000+
      use_for: [speech_recognition, transcription]
      
    - id: common-voice-yo
      name: "Mozilla Common Voice Yoruba"
      source: mozilla-foundation/common_voice_16_1
      platform: huggingface
      language: yoruba
      type: asr
      quality: medium-high
      samples: 500+
      use_for: [speech_recognition, accent_training]
      
    - id: common-voice-ha
      name: "Mozilla Common Voice Hausa"
      source: mozilla-foundation/common_voice_16_1
      platform: huggingface
      language: hausa
      type: asr
      quality: medium-high
      samples: 1000+
      use_for: [speech_recognition, accent_training]
      
    - id: common-voice-ig
      name: "Mozilla Common Voice Igbo"
      source: mozilla-foundation/common_voice_16_1
      platform: huggingface
      language: igbo
      type: asr
      quality: medium
      samples: 200+
      use_for: [speech_recognition, accent_training]

  # ─────────────────────────────────────────────────────────────────────────────
  # TIER 2: SECONDARY - Research/Academic Sources
  # ─────────────────────────────────────────────────────────────────────────────
  secondary:
    - id: afrivoices-ng
      name: "AfriVoices Nigeria"
      source: afrivoices/nigerian-accents
      platform: huggingface
      language: multi-nigerian
      type: asr
      quality: high
      samples: 5000+
      use_for: [accent_modeling, regional_variation]
      
    - id: yoruba-speech-corpus
      name: "Yoruba Speech Corpus"
      source: masakhane/yoruba-asr
      platform: huggingface
      language: yoruba
      type: asr
      quality: high
      samples: 3000+
      use_for: [asr_training, dialect_variation]
      
    - id: hausa-voa
      name: "VOA Hausa News Corpus"
      source: web_scrape
      platform: voa
      url: https://www.voahausa.com
      language: hausa
      type: news_audio
      quality: high
      samples: unlimited
      use_for: [news_style, formal_speech]
      
    - id: bbc-hausa
      name: "BBC Hausa Audio"
      source: web_scrape
      platform: bbc
      url: https://www.bbc.com/hausa
      language: hausa
      type: news_audio
      quality: high
      samples: unlimited
      use_for: [news_style, formal_speech]
      
    - id: bbc-pidgin
      name: "BBC Pidgin Audio"
      source: web_scrape
      platform: bbc
      url: https://www.bbc.com/pidgin
      language: pidgin
      type: news_audio
      quality: high
      samples: unlimited
      use_for: [pidgin_fluency, news_pidgin]
      
    - id: naija-tts
      name: "Naija TTS Dataset"
      source: chrisjay/naijatts
      platform: huggingface
      language: pidgin
      type: tts
      quality: medium
      samples: 1000+
      use_for: [pidgin_synthesis, colloquial]
      
    - id: yoruba-embeddings
      name: "Yoruba Word Embeddings"
      source: Davlan/xlm-roberta-base-finetuned-yoruba
      platform: huggingface
      language: yoruba
      type: embeddings
      quality: high
      use_for: [semantic_understanding, text_processing]
      
    - id: hausa-ner
      name: "Hausa Named Entity Recognition"
      source: masakhane/hausa-ner
      platform: huggingface
      language: hausa
      type: ner
      quality: high
      use_for: [entity_extraction, context_understanding]
      
    - id: igbo-ner
      name: "Igbo Named Entity Recognition"
      source: masakhane/igbo-ner
      platform: huggingface
      language: igbo
      type: ner
      quality: high
      use_for: [entity_extraction, context_understanding]

  # ─────────────────────────────────────────────────────────────────────────────
  # TIER 3: SPECIALIZED - Domain-Specific Sources
  # ─────────────────────────────────────────────────────────────────────────────
  specialized:
    - id: nollywood-subtitles
      name: "Nollywood Movie Subtitles"
      source: web_scrape
      platform: opensubtitles
      url: https://www.opensubtitles.org
      language: multi-nigerian
      type: subtitles
      quality: variable
      samples: 10000+ movies
      use_for: [cultural_context, dialogue_patterns, slang]
      
    - id: nairaland-corpus
      name: "Nairaland Forum Corpus"
      source: web_scrape
      platform: nairaland
      url: https://www.nairaland.com
      language: pidgin-english-mix
      type: text
      quality: medium
      samples: millions
      use_for: [colloquial_language, trending_topics, slang]
      
    - id: wazobia-fm
      name: "Wazobia FM Audio Clips"
      source: web_scrape
      platform: radio
      url: https://wazobia.fm
      language: pidgin
      type: radio_audio
      quality: high
      samples: streaming
      use_for: [broadcast_pidgin, entertainment_style]
      
    - id: afrobeats-lyrics
      name: "Afrobeats Lyrics Database"
      source: genius_api
      platform: genius
      language: multi-nigerian
      type: lyrics
      quality: high
      samples: 50000+
      use_for: [cultural_expressions, slang, vibes]
      
    - id: nigerian-twitter
      name: "Nigerian Twitter Corpus"
      source: twitter_api
      platform: twitter
      language: pidgin-english-mix
      type: social_media
      quality: variable
      samples: millions
      use_for: [trending_language, youth_slang, reactions]
      
    - id: tiktok-naija
      name: "Nigerian TikTok Transcripts"
      source: tiktok_scrape
      platform: tiktok
      language: pidgin-english-mix
      type: video_transcript
      quality: variable
      samples: 100000+
      use_for: [viral_expressions, youth_culture, trends]

# ═══════════════════════════════════════════════════════════════════════════════
# VIDEO TRAINING SOURCES (For Lip-Sync, Expression, Cultural Context)
# ═══════════════════════════════════════════════════════════════════════════════
video_datasets:
