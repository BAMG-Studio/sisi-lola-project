# ═══════════════════════════════════════════════════════════════════════════════
# CULTURAL CONTEXT SOURCES (Personality & Knowledge)
# ═══════════════════════════════════════════════════════════════════════════════
cultural_datasets:
  # Text Corpora for Cultural Understanding
  text_corpora:
    - id: nigerian-proverbs
      name: "Nigerian Proverbs Database"
      source: custom_collection
      languages: [yoruba, hausa, igbo, pidgin]
      samples: 5000+
      use_for: [wisdom, cultural_expression, personality]
      
    - id: nigerian-history
      name: "Nigerian History Corpus"
      source: wikipedia
      languages: [english]
      samples: 10000+ articles
      use_for: [historical_context, knowledge_base]
      
    - id: nigerian-food
      name: "Nigerian Cuisine Database"
      source: custom_collection
      languages: [english, yoruba, hausa, igbo]
      samples: 1000+ recipes
      use_for: [cultural_knowledge, food_recommendations]
      
    - id: nigerian-music-db
      name: "Afrobeats/Naija Music Database"
      source: spotify_api
      samples: 100000+ tracks
      use_for: [music_recommendations, artist_knowledge]
      
    - id: japa-chronicles
      name: "Japa/Diaspora Stories"
      source: web_scrape
      platforms: [nairaland, twitter, reddit]
      samples: 50000+ posts
      use_for: [diaspora_experience, immigration_context]

  # Religious/Spiritual Context
  spiritual_corpora:
    - id: nigerian-prayers
      name: "Nigerian Prayer Patterns"
      source: custom_collection
      languages: [english, yoruba, hausa, igbo]
      samples: 2000+
      use_for: [spiritual_guidance, prayer_generation]
      
    - id: yoruba-oriki
      name: "Yoruba Oriki (Praise Poetry)"
      source: academic_corpus
      language: yoruba
      samples: 500+
      use_for: [cultural_heritage, poetic_expression]

# ═══════════════════════════════════════════════════════════════════════════════
# INTERNET INGESTION SOURCES (Nightly Auto-Fetch)
# ═══════════════════════════════════════════════════════════════════════════════
auto_ingestion:
  # RSS Feeds for Daily Content
  rss_feeds:
    - url: https://www.bbc.com/pidgin/topics/c404v061z85t/rss.xml
      name: "BBC Pidgin RSS"
      language: pidgin
      frequency: hourly
      
    - url: https://www.voahausa.com/api/zyrtyequty
      name: "VOA Hausa RSS"
      language: hausa
      frequency: hourly
      
    - url: https://punchng.com/feed/
      name: "Punch Nigeria RSS"
      language: english-nigerian
      frequency: hourly
      
    - url: https://www.premiumtimesng.com/feed
      name: "Premium Times RSS"
      language: english-nigerian
      frequency: hourly

  # YouTube API Queries
  youtube_queries:
    - query: "Nigerian tech review 2025"
      frequency: daily
      max_results: 10
      
    - query: "Afrobeats new music"
      frequency: daily
      max_results: 20
      
    - query: "Lagos vlog"
      frequency: daily
      max_results: 10
      
    - query: "Nigerian comedy skit"
      frequency: daily
      max_results: 15
      
    - query: "Japa experience"
      frequency: weekly
      max_results: 20

  # Twitter/X Searches
  twitter_searches:
    - query: "Nigeria tech"
      frequency: hourly
      max_results: 100
      
    - query: "#NaijaTech"
      frequency: hourly
      max_results: 50
      
    - query: "lang:pcm"  # Pidgin
      frequency: daily
      max_results: 500

# ═══════════════════════════════════════════════════════════════════════════════
# QUALITY SCORING CRITERIA
# ═══════════════════════════════════════════════════════════════════════════════
quality_scoring:
  voice:
    excellent: # 90-100
      - "Clear pronunciation"
      - "Minimal background noise"
      - "Consistent volume"
      - "Natural intonation"
    good: # 70-89
      - "Understandable pronunciation"
      - "Low background noise"
      - "Acceptable volume variation"
    acceptable: # 50-69
      - "Decipherable speech"
      - "Moderate noise"
      
  video:
    excellent: # 90-100
      - "1080p+ resolution"
      - "Clear face visibility"
      - "Good lighting"
      - "Stable camera"
    good: # 70-89
      - "720p+ resolution"
      - "Face mostly visible"
      - "Acceptable lighting"
    acceptable: # 50-69
      - "480p+ resolution"
      - "Face sometimes visible"

  cultural:
    relevance_factors:
      - "Nigerian context"
      - "Language authenticity"
      - "Cultural accuracy"
      - "Trend relevance"
