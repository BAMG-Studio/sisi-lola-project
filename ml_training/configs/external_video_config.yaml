# Language settings
languages:
  english:
    code: "en"
    target_percentage: 40
    
  yoruba:
    code: "yo"
    target_percentage: 30
    
  nigerian_pidgin:
    code: "np"
    alt_codes: ["pcm"]
    target_percentage: 20
    
  hausa:
    code: "ha"
    target_percentage: 5
    
  igbo:
    code: "ig"
    target_percentage: 5

# Quality thresholds
quality:
  min_confidence: 0.7
  min_segment_length: 10
  max_segment_length: 500
  duplicate_threshold: 0.9

# Cost tracking
costs:
  reccloud_per_minute: 0.004
  estimated_examples_per_minute: 8.83  # Based on 530 examples / 60 minutes
